name: Integration Tests

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches:
      - main
      - release/*
  pull_request:
    branches:
      - main
      - release/*
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  integration-test-shards:
    name: Integration tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [schema-compare-files, schema-compare, database, services]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Packages.props
            global.json
            nuget.config
            .config/dotnet-tools.json
            **/*.csproj

      - name: Select integration test shard
        id: test_shard
        shell: pwsh
        env:
          INTEGRATION_SHARD: ${{ matrix.shard }}
        run: |
          $filter = ./scripts/Get-IntegrationTestFilter.ps1 -Shard $env:INTEGRATION_SHARD
          Add-Content -Path $env:GITHUB_OUTPUT -Value "filter=$filter"

      - name: Generate SQL authentication password
        shell: pwsh
        run: |
          $chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'.ToCharArray()
          $passwordBody = -join (1..24 | ForEach-Object { $chars[(Get-Random -Maximum $chars.Length)] })
          $sqlPassword = "A1!b$passwordBody" # 'A1!' prefix is to meet password complexity requirements for SQL
          Write-Output "::add-mask::$sqlPassword"
          Add-Content -Path $env:GITHUB_ENV -Value "SQL_PASSWORD=$sqlPassword"
          Add-Content -Path $env:GITHUB_ENV -Value "sqlOnPrem_password=$sqlPassword"
          Add-Content -Path $env:GITHUB_ENV -Value "sqlAzure_password=$sqlPassword"

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Generate code
        shell: pwsh
        run: |
          dotnet tool run dotnet-cake -- build.cake --target=SRGen
          dotnet tool run dotnet-cake -- build.cake --target=CodeGen

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cake-build-logs-${{ matrix.shard }}
          path: artifacts/logs
          if-no-files-found: ignore

      - name: Start SQL Server container
        shell: pwsh
        run: |
          docker pull mcr.microsoft.com/mssql/server:2025-latest
          docker rm -f sqltoolsservice-integration-tests *> $null
          docker run `
            --detach `
            --name sqltoolsservice-integration-tests `
            --hostname sqltoolsservice-integration-tests `
            --publish 1433:1433 `
            --env ACCEPT_EULA=Y `
            --env MSSQL_PID=Developer `
            --env MSSQL_AGENT_ENABLED=true `
            --env MSSQL_SA_PASSWORD="$env:SQL_PASSWORD" `
            mcr.microsoft.com/mssql/server:2025-latest

      - name: Create SQL login for integration tests
        shell: pwsh
        run: |
          $ready = $false
          for ($attempt = 1; $attempt -le 30; $attempt++) {
            docker exec sqltoolsservice-integration-tests /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $env:SQL_PASSWORD -C -Q "SELECT 1" *> $null
            if ($LASTEXITCODE -eq 0) {
              $ready = $true
              break
            }

            Start-Sleep -Seconds 5
          }

          if (-not $ready) {
            throw "SQL Server container did not become ready in time."
          }

          $sql = "IF NOT EXISTS (SELECT 1 FROM sys.sql_logins WHERE name = 'testAccount') BEGIN CREATE LOGIN [testAccount] WITH PASSWORD = '$($env:SQL_PASSWORD)', CHECK_POLICY = OFF; END; ALTER SERVER ROLE [sysadmin] ADD MEMBER [testAccount];"
          docker exec sqltoolsservice-integration-tests /opt/mssql-tools18/bin/sqlcmd `
            -S localhost `
            -U sa `
            -P $env:SQL_PASSWORD `
            -C `
            -Q $sql

      - name: Create integration test connection instances file
        shell: pwsh
        run: |
          @'
          <?xml version="1.0" encoding="utf-8"?>
          <Instances>
            <Instance VersionKey="sqlOnPrem">
              <DataSource>localhost</DataSource>
              <UserId>testAccount</UserId>
              <Password></Password>
            </Instance>
            <Instance VersionKey="sqlAzure">
              <DataSource>localhost</DataSource>
              <UserId>testAccount</UserId>
              <Password></Password>
            </Instance>
          </Instances>
          '@ | Set-Content -Path test/Microsoft.SqlTools.ServiceLayer.TestEnvConfig/SQLConnectionInstances.CI.xml

      - name: Generate integration test settings
        shell: pwsh
        run: |
          dotnet run `
            --project test/Microsoft.SqlTools.ServiceLayer.TestEnvConfig/Microsoft.SqlTools.ServiceLayer.TestEnvConfig.csproj `
            -- `
            test/Microsoft.SqlTools.ServiceLayer.TestEnvConfig/SQLConnectionInstances.CI.xml

      - name: Build integration tests
        shell: pwsh
        run: |
          dotnet build test/Microsoft.SqlTools.ServiceLayer.IntegrationTests/Microsoft.SqlTools.ServiceLayer.IntegrationTests.csproj --configuration Release

      - name: Build STS2 tests
        if: matrix.shard == 'services'
        shell: pwsh
        run: |
          dotnet build test/sts2/Microsoft.SqlTools.Sts2.UnitTests/Microsoft.SqlTools.Sts2.UnitTests.csproj --configuration Release
          dotnet build test/sts2/Microsoft.SqlTools.Sts2.E2ETests/Microsoft.SqlTools.Sts2.E2ETests.csproj --configuration Release

      - name: Run SQL project integration tests
        if: matrix.shard == 'services'
        id: sql_project_tests
        continue-on-error: true
        timeout-minutes: 60
        shell: pwsh
        run: |
          $filter = ./scripts/Get-IntegrationTestFilter.ps1 -Shard sql-projects
          dotnet test test/Microsoft.SqlTools.ServiceLayer.IntegrationTests/Microsoft.SqlTools.ServiceLayer.IntegrationTests.csproj `
            --configuration Release `
            --no-build `
            --no-restore `
            --filter $filter `
            --logger "console;verbosity=normal" `
            --logger "trx;LogFileName=SqlProjectIntegrationTests.trx" `
            --results-directory "$PWD/TestResults"

      - name: Run integration tests
        id: integration_tests
        continue-on-error: true
        timeout-minutes: 60
        shell: pwsh
        env:
          INTEGRATION_TEST_FILTER: ${{ steps.test_shard.outputs.filter }}
        run: |
          dotnet test test/Microsoft.SqlTools.ServiceLayer.IntegrationTests/Microsoft.SqlTools.ServiceLayer.IntegrationTests.csproj `
            --configuration Release `
            --no-build `
            --no-restore `
            --filter $env:INTEGRATION_TEST_FILTER `
            --logger "console;verbosity=normal" `
            --logger "trx;LogFileName=IntegrationTests.trx" `
            --results-directory "$PWD/TestResults"

      - name: Run STS2 tests
        if: matrix.shard == 'services'
        id: sts2_tests
        continue-on-error: true
        timeout-minutes: 30
        shell: pwsh
        run: |
          $env:STS2_REQUIRE_SQLSERVER = "1"
          $env:STS2_SQLSERVER_CONNSTRING = "Server=localhost,1433;User ID=testAccount;Password=$env:SQL_PASSWORD;Encrypt=False;TrustServerCertificate=True"

          dotnet test test/sts2/Microsoft.SqlTools.Sts2.UnitTests/Microsoft.SqlTools.Sts2.UnitTests.csproj `
            --configuration Release `
            --no-build `
            --logger "trx;LogFileName=Sts2UnitTests.trx" `
            --results-directory "$PWD/TestResults"
          $unitExit = $LASTEXITCODE

          dotnet test test/sts2/Microsoft.SqlTools.Sts2.E2ETests/Microsoft.SqlTools.Sts2.E2ETests.csproj `
            --configuration Release `
            --no-build `
            --logger "trx;LogFileName=Sts2E2ETests.trx" `
            --results-directory "$PWD/TestResults"
          $e2eExit = $LASTEXITCODE

          if ($unitExit -ne 0 -or $e2eExit -ne 0) {
            exit 1
          }

      - name: Publish integration test report
        if: always()
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: Integration Tests (${{ matrix.shard }})
          path: TestResults/*.trx
          reporter: dotnet-trx
          fail-on-error: false

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-test-results-${{ matrix.shard }}
          path: TestResults/*.trx
          if-no-files-found: ignore

      - name: Stop SQL container
        if: always()
        shell: pwsh
        run: docker rm -f sqltoolsservice-integration-tests *> $null

      - name: Fail workflow when integration tests fail
        if: always() && (steps.integration_tests.outcome == 'failure' || steps.sql_project_tests.outcome == 'failure' || steps.sts2_tests.outcome == 'failure')
        shell: pwsh
        run: exit 1

  # Keep the original aggregate check name available for branch protection.
  integration-tests:
    needs: integration-test-shards
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every integration test shard to pass
        env:
          SHARD_RESULT: ${{ needs.integration-test-shards.result }}
        run: test "$SHARD_RESULT" = success
